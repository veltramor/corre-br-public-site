<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Corre BR - Pre-Cadastro</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="landing-shell">
      <section class="landing-hero">
        <div class="brand-sign landing-brand">
          <span class="brand-title">Corre BR</span>
          <span class="brand-subtitle">Negocio De Bairro</span>
        </div>
        <h1>Transforme seu corre de bairro em um imperio brasileiro.</h1>
        <p>
          Combine itens, entregue pedidos, melhore sua barraca e desbloqueie novos bairros em um jogo
          rapido, leve e gratuito.
        </p>
        <a class="play-link" href="./index.html">Testar prototipo</a>
      </section>

      <section class="signup-panel" aria-label="Pre-cadastro">
        <h2>Entre na lista de pre-lancamento</h2>
        <form id="signupForm">
          <label>
            Nome
            <input id="signupName" name="name" required autocomplete="name" />
          </label>
          <label>
            WhatsApp ou e-mail
            <input id="signupContact" name="contact" required autocomplete="email" />
          </label>
          <label>
            Cidade
            <input id="signupCity" name="city" required autocomplete="address-level2" />
          </label>
          <button class="primary-button" type="submit">Quero jogar primeiro</button>
        </form>
        <p id="signupFeedback" class="signup-feedback" role="status"></p>
      </section>

      <section id="leadDebugPanel" class="lead-debug-panel is-hidden" aria-label="Exportar leads locais">
        <h2>Leads locais</h2>
        <p id="leadDebugSummary">0 leads neste navegador.</p>
        <div class="lead-debug-actions">
          <button id="copyLeadsButton" type="button">Copiar JSON</button>
          <button id="downloadLeadsButton" type="button">Baixar JSON</button>
          <button id="clearLeadsButton" type="button">Limpar</button>
        </div>
      </section>
    </main>

    <script>
      const form = document.querySelector("#signupForm");
      const feedback = document.querySelector("#signupFeedback");
      const debugPanel = document.querySelector("#leadDebugPanel");
      const debugSummary = document.querySelector("#leadDebugSummary");
      const copyLeadsButton = document.querySelector("#copyLeadsButton");
      const downloadLeadsButton = document.querySelector("#downloadLeadsButton");
      const clearLeadsButton = document.querySelector("#clearLeadsButton");
      const configuredLeadEndpoint = "";
      const leadEndpoint = window.CORRE_BR_LEAD_ENDPOINT || configuredLeadEndpoint;
      const params = new URLSearchParams(location.search);
      const debugLeads = params.get("debug") === "leads";
      const attribution = {
        utm_source: params.get("utm_source") || "direct",
        utm_medium: params.get("utm_medium") || "none",
        utm_campaign: params.get("utm_campaign") || "none",
        utm_content: params.get("utm_content") || "none"
      };

      const getLocalLeads = () => JSON.parse(localStorage.getItem("correBrLeads") || "[]");

      const updateDebugPanel = () => {
        if (!debugLeads) return;
        const leads = getLocalLeads();
        debugSummary.textContent = `${leads.length} lead${leads.length === 1 ? "" : "s"} neste navegador.`;
      };

      const exportLocalLeads = () => JSON.stringify({
        exportedAt: new Date().toISOString(),
        page: location.href,
        leads: getLocalLeads()
      }, null, 2);

      if (debugLeads) {
        debugPanel.classList.remove("is-hidden");
        updateDebugPanel();
      }

      const sendLead = async (lead) => {
        if (!leadEndpoint) return { mode: "local_only" };
        const response = await fetch(leadEndpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(lead)
        });
        if (!response.ok) throw new Error("lead_endpoint_failed");
        return { mode: "endpoint" };
      };

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const lead = {
          name: document.querySelector("#signupName").value.trim(),
          contact: document.querySelector("#signupContact").value.trim(),
          city: document.querySelector("#signupCity").value.trim(),
          attribution,
          at: new Date().toISOString()
        };
        const leads = getLocalLeads();
        leads.push(lead);
        localStorage.setItem("correBrLeads", JSON.stringify(leads));
        try {
          const result = await sendLead(lead);
          feedback.textContent = result.mode === "endpoint"
            ? "Voce entrou na lista. Quando o primeiro teste abrir, a gente te chama."
            : "Voce entrou na lista neste teste. Para campanha paga, ative a captura central.";
          form.reset();
          updateDebugPanel();
        } catch {
          feedback.textContent = "Cadastro salvo neste teste, mas a captura central falhou. Tente de novo em instantes.";
          updateDebugPanel();
        }
      });

      copyLeadsButton.addEventListener("click", async () => {
        await navigator.clipboard.writeText(exportLocalLeads());
        debugSummary.textContent = "Leads copiados em JSON.";
      });

      downloadLeadsButton.addEventListener("click", () => {
        const blob = new Blob([exportLocalLeads()], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `corre-br-leads-${new Date().toISOString().slice(0, 10)}.json`;
        link.click();
        URL.revokeObjectURL(url);
      });

      clearLeadsButton.addEventListener("click", () => {
        localStorage.removeItem("correBrLeads");
        updateDebugPanel();
      });
    </script>
  </body>
</html>
